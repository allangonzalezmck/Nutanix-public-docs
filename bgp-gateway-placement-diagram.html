<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGP Gateway Placement</title>
<style>
  :root{
    --bg:#0F161F;
    --panel:#161F29;
    --panel-2:#1C2731;
    --line:#2C3A47;
    --text:#DCE4EA;
    --text-dim:#7C8A97;
    --ok:#45C7B0;
    --fail:#E5484D;
    --warn:#E8A33D;
    --leader:#3A4756;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; }

  .card{
    width:100%;
    max-width:820px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 28px 24px;
  }

  header{ margin-bottom:18px; }
  h1{
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--text-dim);
    font-size:0.95rem;
    max-width:56ch;
    line-height:1.5;
    margin:0;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin:20px 0 6px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    appearance:none;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:0.9rem;
    font-weight:500;
    padding:9px 4px 11px;
    margin-right:22px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab:hover{ color:var(--text); }
  .tab:focus-visible{ outline:2px solid var(--ok); outline-offset:3px; border-radius:3px; }
  .tab[aria-selected="true"]{
    color:var(--text);
    border-bottom-color:var(--ok);
  }

  .caption{
    color:var(--text-dim);
    font-size:0.85rem;
    line-height:1.5;
    margin:14px 0 4px;
    min-height:2.6em;
  }
  .caption b{ color:var(--text); font-weight:600; }

  .diagram-wrap{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 4px 0;
    margin-top:10px;
  }
  svg{ width:100%; height:auto; display:block; }

  .host-box{ fill:var(--panel); stroke:var(--line); stroke-width:1.5; transition:stroke .3s ease, fill .3s ease; }
  .host-box.failed{ stroke:var(--fail); fill:#241417; }
  .host-label{ fill:var(--text-dim); font-size:11px; font-family:"IBM Plex Mono",monospace; }
  .host-label.failed{ fill:var(--fail); }
  .leader-box{ fill:var(--panel); stroke:var(--leader); stroke-width:1.5; stroke-dasharray:3 3; }
  .leader-label{ fill:var(--text-dim); font-size:10px; font-family:"IBM Plex Mono",monospace; }

  .tor-box{ fill:var(--panel-2); stroke:var(--line); stroke-width:1.5; }
  .tor-label{ fill:var(--text); font-size:12px; font-weight:600; font-family:"IBM Plex Mono",monospace; }

  .gw-box{
    fill:#132229; stroke:var(--ok); stroke-width:1.5; rx:5;
    transition:stroke .35s ease, fill .35s ease, opacity .35s ease;
  }
  .gw-box.down{ stroke:var(--fail); fill:#241417; opacity:0.55; }
  .gw-label{ fill:var(--ok); font-size:11px; font-weight:600; font-family:"IBM Plex Mono",monospace; transition:fill .35s ease, opacity .35s ease; }
  .gw-label.down{ fill:var(--fail); opacity:0.6; }
  .gw-sub{ fill:var(--text-dim); font-size:9px; font-family:"IBM Plex Mono",monospace; }

  .bgp-line{
    stroke:var(--ok);
    stroke-width:2;
    fill:none;
    stroke-dasharray:6 5;
    animation:flow 1.1s linear infinite;
    transition:stroke .35s ease, opacity .4s ease;
  }
  .bgp-line.down{
    stroke:var(--fail);
    stroke-dasharray:3 4;
    opacity:0.35;
    animation:none;
  }
  @keyframes flow{ to{ stroke-dashoffset:-22; } }

  .fail-mark{ opacity:0; transition:opacity .3s ease; }
  .fail-mark.show{ opacity:1; }

  .controls{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-top:18px;
  }
  button.action{
    appearance:none;
    font-family:inherit;
    font-size:0.88rem;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    border:1px solid var(--fail);
    background:rgba(229,72,77,0.1);
    color:#F3A6A8;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  button.action:hover{ background:rgba(229,72,77,0.18); }
  button.action:disabled{ opacity:0.4; cursor:default; }
  button.action:focus-visible{ outline:2px solid var(--fail); outline-offset:3px; }

  button.reset{
    appearance:none;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:0.85rem;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:4px;
  }
  button.reset:hover{ color:var(--text); }
  button.reset:disabled{ opacity:0.35; cursor:default; text-decoration:none; }
  button.reset:focus-visible{ outline:2px solid var(--ok); outline-offset:2px; border-radius:3px; }

  .status{
    display:flex;
    gap:28px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .stat-label{
    color:var(--text-dim);
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:3px;
  }
  .stat-value{
    font-family:"IBM Plex Mono",monospace;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ok);
    transition:color .3s ease;
  }
  .stat-value.bad{ color:var(--fail); }

  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:16px;
    font-size:0.78rem;
    color:var(--text-dim);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot.ok{ background:var(--ok); }
  .dot.fail{ background:var(--fail); }
  .dot.leader{ background:var(--leader); border:1px dashed var(--text-dim); }

  @media (max-width:520px){
    .card{ padding:20px 18px; }
    h1{ font-size:1.25rem; }
    .status{ gap:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bgp-line{ animation:none; }
    *{ transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>BGP Gateway Placement</h1>
    <p class="sub">Same host failure, two different outcomes — depending on where the two BGP Gateway VMs actually sit.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Placement scenario">
    <button class="tab" id="tab-deployed" role="tab" aria-selected="true" aria-controls="panel">As Deployed</button>
    <button class="tab" id="tab-fixed" role="tab" aria-selected="false" aria-controls="panel">With Anti-Affinity Enforced</button>
  </div>

  <p class="caption" id="caption"></p>

  <div class="diagram-wrap" id="panel" role="tabpanel">
    <svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="false">

      <!-- ToR switches -->
      <rect class="tor-box" x="120" y="20" width="100" height="42" rx="5"></rect>
      <text class="tor-label" x="170" y="46" text-anchor="middle">TOR-A</text>
      <rect class="tor-box" x="540" y="20" width="100" height="42" rx="5"></rect>
      <text class="tor-label" x="590" y="46" text-anchor="middle">TOR-B</text>

      <!-- BGP session lines -->
      <path id="line-gwA-torA" class="bgp-line" d="M380,200 L170,64"></path>
      <path id="line-gwA-torB" class="bgp-line" d="M380,200 L590,64"></path>
      <path id="line-gwB-torA" class="bgp-line" d="M380,250 L170,64"></path>
      <path id="line-gwB-torB" class="bgp-line" d="M380,250 L590,64"></path>

      <!-- Host 1 : Acropolis Leader, never eligible -->
      <rect class="leader-box" x="30" y="170" width="180" height="150" rx="6"></rect>
      <text class="leader-label" x="120" y="196" text-anchor="middle">HOST-1</text>
      <text class="leader-label" x="120" y="212" text-anchor="middle" fill="#7C8A97">Leader &#8212; ineligible</text>

      <!-- Host 2 -->
      <rect id="host2" class="host-box" x="290" y="170" width="180" height="150" rx="6"></rect>
      <text id="host2-label" class="host-label" x="380" y="188" text-anchor="middle">HOST-2</text>
      <g id="fail-mark-host2" class="fail-mark">
        <line x1="440" y1="180" x2="460" y2="200" stroke="#E5484D" stroke-width="2.5"></line>
        <line x1="460" y1="180" x2="440" y2="200" stroke="#E5484D" stroke-width="2.5"></line>
      </g>

      <!-- Host 3 -->
      <rect id="host3" class="host-box" x="550" y="170" width="180" height="150" rx="6"></rect>
      <text id="host3-label" class="host-label" x="640" y="188" text-anchor="middle">HOST-3</text>

      <!-- Gateway A : always in Host-2 -->
      <rect id="gwA-box" class="gw-box" x="310" y="200" width="140" height="38" rx="5"></rect>
      <text id="gwA-label" class="gw-label" x="380" y="223" text-anchor="middle">GATEWAY-A</text>

      <!-- Gateway B : moves between Host-2 (as deployed) and Host-3 (fixed) -->
      <rect id="gwB-box" class="gw-box" x="310" y="250" width="140" height="38" rx="5"></rect>
      <text id="gwB-label" class="gw-label" x="380" y="273" text-anchor="middle">GATEWAY-B</text>

    </svg>
  </div>

  <div class="legend">
    <span><i class="dot ok"></i>Active BGP session</span>
    <span><i class="dot fail"></i>Session down</span>
    <span><i class="dot leader"></i>Ineligible host</span>
  </div>

  <div class="controls">
    <button class="action" id="fail-btn">Simulate host failure</button>
    <button class="reset" id="reset-btn" disabled>Reset</button>
  </div>

  <div class="status">
    <div>
      <div class="stat-label">BGP sessions active</div>
      <div class="stat-value" id="stat-sessions">4 / 4</div>
    </div>
    <div>
      <div class="stat-label">Advertised prefixes</div>
      <div class="stat-value" id="stat-prefixes">Advertised</div>
    </div>
  </div>
</div>

<script>
(function(){
  var state = { tab: 'deployed', failed: false };

  var els = {
    tabDeployed: document.getElementById('tab-deployed'),
    tabFixed: document.getElementById('tab-fixed'),
    caption: document.getElementById('caption'),
    host2: document.getElementById('host2'),
    host2Label: document.getElementById('host2-label'),
    host3: document.getElementById('host3'),
    host3Label: document.getElementById('host3-label'),
    failMark: document.getElementById('fail-mark-host2'),
    gwABox: document.getElementById('gwA-box'),
    gwALabel: document.getElementById('gwA-label'),
    gwBBox: document.getElementById('gwB-box'),
    gwBLabel: document.getElementById('gwB-label'),
    lineAA: document.getElementById('line-gwA-torA'),
    lineAB: document.getElementById('line-gwA-torB'),
    lineBA: document.getElementById('line-gwB-torA'),
    lineBB: document.getElementById('line-gwB-torB'),
    failBtn: document.getElementById('fail-btn'),
    resetBtn: document.getElementById('reset-btn'),
    statSessions: document.getElementById('stat-sessions'),
    statPrefixes: document.getElementById('stat-prefixes')
  };

  var captions = {
    deployed: 'Both <b>Gateway-A</b> and <b>Gateway-B</b> are on <b>Host-2</b>. No anti-affinity policy is preventing this &#8212; it is how the two gateways happened to land.',
    fixed: 'An anti-affinity policy keeps <b>Gateway-A</b> and <b>Gateway-B</b> on separate hosts. The scheduler will not place both together, in normal operation or on failover.'
  };

  function positionGwB(){
    if (state.tab === 'deployed') {
      els.gwBBox.setAttribute('x', 310);
      els.gwBBox.setAttribute('y', 250);
      els.gwBLabel.setAttribute('x', 380);
      els.gwBLabel.setAttribute('y', 273);
      els.lineBA.setAttribute('d', 'M380,250 L170,64');
      els.lineBB.setAttribute('d', 'M380,250 L590,64');
      els.host3Label.style.opacity = 0.35;
    } else {
      els.gwBBox.setAttribute('x', 570);
      els.gwBBox.setAttribute('y', 225);
      els.gwBLabel.setAttribute('x', 640);
      els.gwBLabel.setAttribute('y', 248);
      els.lineBA.setAttribute('d', 'M640,225 L170,64');
      els.lineBB.setAttribute('d', 'M640,225 L590,64');
      els.host3Label.style.opacity = 1;
    }
  }

  function render(){
    els.tabDeployed.setAttribute('aria-selected', state.tab === 'deployed');
    els.tabFixed.setAttribute('aria-selected', state.tab === 'fixed');
    els.caption.innerHTML = captions[state.tab];
    positionGwB();

    var gwAFails = state.failed;
    var gwBFails = state.failed && state.tab === 'deployed';

    els.host2.classList.toggle('failed', state.failed);
    els.host2Label.classList.toggle('failed', state.failed);
    els.failMark.classList.toggle('show', state.failed);

    els.gwABox.classList.toggle('down', gwAFails);
    els.gwALabel.classList.toggle('down', gwAFails);
    els.lineAA.classList.toggle('down', gwAFails);
    els.lineAB.classList.toggle('down', gwAFails);

    els.gwBBox.classList.toggle('down', gwBFails);
    els.gwBLabel.classList.toggle('down', gwBFails);
    els.lineBA.classList.toggle('down', gwBFails);
    els.lineBB.classList.toggle('down', gwBFails);

    var activeSessions = 4;
    if (state.failed) activeSessions = (state.tab === 'deployed') ? 0 : 2;
    els.statSessions.textContent = activeSessions + ' / 4';
    els.statSessions.classList.toggle('bad', activeSessions === 0);

    var prefixesOk = activeSessions > 0;
    els.statPrefixes.textContent = prefixesOk ? 'Advertised' : 'Withdrawn';
    els.statPrefixes.classList.toggle('bad', !prefixesOk);

    els.failBtn.disabled = state.failed;
    els.resetBtn.disabled = !state.failed;
  }

  els.tabDeployed.addEventListener('click', function(){
    state.tab = 'deployed'; state.failed = false; render();
  });
  els.tabFixed.addEventListener('click', function(){
    state.tab = 'fixed'; state.failed = false; render();
  });
  els.failBtn.addEventListener('click', function(){
    state.failed = true; render();
  });
  els.resetBtn.addEventListener('click', function(){
    state.failed = false; render();
  });

  render();
})();
</script>
</body>
</html>
